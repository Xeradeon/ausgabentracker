<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AusgabenTracker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --orange: #ff7a00;
      --orange2: #ff9e2f;
      --orange3: #ffb85e;
      --white: rgba(255,255,255,.96);
      --muted: rgba(255,255,255,.58);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 34%, rgba(255,120,0,.10), transparent 25%),
        radial-gradient(circle at 50% 58%, rgba(255,120,0,.06), transparent 32%),
        linear-gradient(180deg, #0b0b0b 0%, #000 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: calc(env(safe-area-inset-top) + 18px) 24px calc(env(safe-area-inset-bottom) + 26px);
      position: relative;
      isolation: isolate;
    }

    .embers, .embers::before, .embers::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
    }

    .embers {
      background:
        radial-gradient(circle at 12% 80%, rgba(255,132,24,.35) 0 1px, transparent 2px),
        radial-gradient(circle at 80% 22%, rgba(255,132,24,.34) 0 1.3px, transparent 2.6px),
        radial-gradient(circle at 68% 68%, rgba(255,132,24,.28) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 34% 38%, rgba(255,132,24,.22) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 90% 75%, rgba(255,132,24,.25) 0 1px, transparent 2px),
        radial-gradient(circle at 18% 25%, rgba(255,132,24,.25) 0 1.1px, transparent 2.2px);
      animation: embersFloat 8s linear infinite;
      opacity: .95;
      z-index: -2;
    }

    .embers::before {
      background:
        radial-gradient(circle at 22% 96%, rgba(255,120,0,.2) 0 1px, transparent 2px),
        radial-gradient(circle at 73% 90%, rgba(255,120,0,.2) 0 1px, transparent 2px),
        radial-gradient(circle at 52% 88%, rgba(255,120,0,.2) 0 1px, transparent 2px),
        radial-gradient(circle at 90% 92%, rgba(255,120,0,.2) 0 1px, transparent 2px);
      filter: blur(.2px);
      animation: embersFloat2 12s linear infinite;
    }

    .embers::after {
      background:
        radial-gradient(circle at 50% 50%, rgba(255,122,0,.16), transparent 44%);
      filter: blur(26px);
      animation: pulseField 2.5s ease-in-out infinite alternate;
    }

    .wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-2vh);
      animation: enter .55s cubic-bezier(.2,.8,.2,1) both;
    }

    .icon-stage {
      position: relative;
      width: 156px;
      height: 156px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
    }

    .chakra-ring,
    .chakra-ring::before,
    .chakra-ring::after {
      position: absolute;
      border-radius: 999px;
      inset: 0;
      content: "";
    }

    .chakra-ring {
      inset: -16px;
      background:
        conic-gradient(from 0deg,
          rgba(255,122,0,0) 0deg,
          rgba(255,122,0,.95) 60deg,
          rgba(255,184,94,.85) 100deg,
          rgba(255,122,0,0) 150deg,
          rgba(255,122,0,0) 250deg,
          rgba(255,122,0,.6) 315deg,
          rgba(255,122,0,0) 360deg);
      filter: blur(1px);
      animation: spin 2.2s linear infinite;
      opacity: .92;
    }

    .chakra-ring::before {
      inset: 12px;
      border: 1.5px solid rgba(255,122,0,.35);
      box-shadow:
        0 0 22px rgba(255,122,0,.24),
        inset 0 0 16px rgba(255,122,0,.18);
      animation: spinReverse 3.4s linear infinite;
    }

    .chakra-ring::after {
      inset: -6px;
      background: radial-gradient(circle, rgba(255,122,0,.18), transparent 58%);
      filter: blur(14px);
      animation: pulseField 1.8s ease-in-out infinite alternate;
      z-index: -1;
    }

    .icon-wrap {
      width: 132px;
      height: 132px;
      border-radius: 31px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05),
        0 0 30px rgba(255,122,0,.22),
        0 18px 50px rgba(0,0,0,.45);
    }

    .icon {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 31px;
      transform: scale(1.001);
    }

    .icon-flare {
      position: absolute;
      inset: 0;
      border-radius: 31px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.16), transparent 28%),
        radial-gradient(circle at 22% 24%, rgba(255,190,120,.26), transparent 24%);
      mix-blend-mode: screen;
      animation: shimmer 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      color: var(--white);
      font-size: 28px;
      line-height: 1.12;
      font-weight: 740;
      letter-spacing: -.6px;
      text-shadow: 0 2px 18px rgba(0,0,0,.45);
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      margin: 8px 0 22px;
      letter-spacing: .2px;
    }

    .progress-wrap {
      width: 146px;
      height: 10px;
      border-radius: 999px;
      padding: 2px;
      background: rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }

    .progress {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      background: rgba(0,0,0,.18);
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(0);
      border-radius: 999px;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,122,0,1) 0 14px,
          rgba(255,160,52,.95) 14px 28px
        );
      box-shadow:
        0 0 16px rgba(255,122,0,.72),
        0 0 26px rgba(255,122,0,.32);
      animation: load 1.45s cubic-bezier(.15,.7,.1,1) forwards;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.38), transparent);
      transform: translateX(-100%);
      animation: glide 1.1s ease-in-out .24s infinite;
    }

    .swirl {
      position: absolute;
      width: 92vw;
      max-width: 560px;
      height: 92vw;
      max-height: 560px;
      border-radius: 50%;
      border: 1px solid transparent;
      opacity: .24;
      background:
        conic-gradient(from 140deg,
          transparent 0deg,
          rgba(255,122,0,.22) 40deg,
          transparent 94deg,
          rgba(255,122,0,.14) 182deg,
          transparent 260deg,
          rgba(255,122,0,.16) 320deg,
          transparent 360deg);
      filter: blur(8px);
      z-index: -1;
      animation: spinSlow 12s linear infinite;
    }

    .flash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(255,164,74,.35), rgba(0,0,0,0) 38%);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    .flash.show {
      animation: flash .35s ease forwards;
    }

    .fade {
      animation: leave .26s ease forwards;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(10px) scale(.97); }
      to   { opacity: 1; transform: translateY(-2vh) scale(1); }
    }
    @keyframes leave {
      to { opacity: 0; transform: translateY(-2vh) scale(1.03); filter: blur(.4px); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinReverse { to { transform: rotate(-360deg); } }
    @keyframes spinSlow { to { transform: rotate(360deg); } }
    @keyframes shimmer {
      0%,100% { opacity: .62; }
      50% { opacity: .95; }
    }
    @keyframes load {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
    @keyframes glide {
      from { transform: translateX(-100%); }
      to { transform: translateX(140%); }
    }
    @keyframes pulseField {
      from { opacity: .55; transform: scale(.98); }
      to { opacity: 1; transform: scale(1.035); }
    }
    @keyframes embersFloat {
      from { transform: translateY(10px); }
      to { transform: translateY(-18px); }
    }
    @keyframes embersFloat2 {
      from { transform: translateY(20px); }
      to { transform: translateY(-38px); }
    }
    @keyframes flash {
      0% { opacity: 0; }
      35% { opacity: .9; }
      100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>

  <div class="swirl"></div>
  <div class="flash" id="flash"></div>
