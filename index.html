<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AusgabenTracker</title>
<style>
html,body{
  margin:0;width:100%;height:100%;background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
#bg{
  position:fixed;inset:0;background:
    radial-gradient(circle at 50% 38%,rgba(255,122,0,.18),transparent 28%),
    linear-gradient(#090909,#000);
}
.spark{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:#ff7a00;box-shadow:0 0 10px #ff7a00;
  animation:rise 2.6s linear infinite;
}
.s1{left:14%;top:80%;animation-delay:.1s} .s2{left:28%;top:72%;animation-delay:.8s}
.s3{left:72%;top:78%;animation-delay:.4s} .s4{left:84%;top:68%;animation-delay:1.2s}
.s5{left:62%;top:86%;animation-delay:1.6s} .s6{left:38%;top:88%;animation-delay:2s}
.card{
  position:relative;z-index:2;text-align:center;transform:translateY(-4vh);
}
.ring{
  width:166px;height:166px;margin:0 auto 22px;position:relative;border-radius:50%;
  background:conic-gradient(transparent 0 12%,#ff7a00 22%,#ffb15c 33%,transparent 46% 73%,#ff7a00 88%,transparent 100%);
  animation:spin 2s linear infinite;
  filter:drop-shadow(0 0 14px rgba(255,122,0,.5));
}
.ring:after{
  content:"";position:absolute;inset:10px;border-radius:50%;background:#050505;
}
.icon{
  position:absolute;z-index:3;width:132px;height:132px;left:17px;top:17px;
  border-radius:30px;object-fit:cover;
  box-shadow:0 0 28px rgba(255,122,0,.4);
}
h1{font-size:28px;margin:0 0 7px;font-weight:750;letter-spacing:-.6px}
p{margin:0 0 24px;color:rgba(255,255,255,.55);font-size:14px}
.track{
  width:150px;height:7px;margin:0 auto;background:#222;border-radius:999px;overflow:hidden;
}
.fill{
  width:100%;height:100%;transform-origin:left center;transform:scaleX(0);
  background:linear-gradient(90deg,#ff6a00,#ffa33a);
  box-shadow:0 0 14px rgba(255,122,0,.75);
  animation:load 1.55s ease-out forwards;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes load{to{transform:scaleX(1)}}
@keyframes rise{
  0%{transform:translateY(20px);opacity:0}
  25%{opacity:1}
  100%{transform:translateY(-110px);opacity:0}
}
#flash{position:fixed;inset:0;background:#ff7a00;opacity:0;pointer-events:none;z-index:10}
.flash{animation:flash .22s ease-out forwards}
@keyframes flash{0%{opacity:0}50%{opacity:.18}100%{opacity:0}}
</style>
</head>
<body>
<div id="bg"></div>
<div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div>
<div class="spark s4"></div><div class="spark s5"></div><div class="spark s6"></div>

<main class="card">
  <div class="ring"><img class="icon" src="./icon.png?v=3" alt=""></div>
  <h1>AusgabenTracker</h1>
  <p>Wird gestartet …</p>
  <div class="track"><div class="fill"></div></div>
</main>
<div id="flash"></div>

<script>
setTimeout(function(){
  document.getElementById("flash").className="flash";
  setTimeout(function(){
    window.location.href="https://claude.ai/artifact/FUVDim8wYYuAdwDgCAKNWW?v=3";
  },180);
},1700);
</script>
</body>
</html>
