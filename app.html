    render();
  });
  document.getElementById("nextMonth").addEventListener("click", () => {
    viewDate.setMonth(viewDate.getMonth() + 1);
    listDateFrom = "";
    listDateTo = "";
    render();
  });

  // Category grid (expense sheet)
  const catGrid = document.getElementById("catGrid");
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn";
    btn.type = "button";
    btn.dataset.id = cat.id;
    btn.innerHTML = `<span class="ic">${cat.icon}</span><span class="lbl">${cat.label}</span>`;
    btn.addEventListener("click", () => {
      selectedCat = cat.id;
      catGrid.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      validateExpenseForm();
    });
    catGrid.appendChild(btn);
  });

  // Generic sheet handling
  const scrim = document.getElementById("scrim");
  const allSheets = ["sheet","limitSheet","goalSheet","contribSheet","transferSheet","aboSheet","salarySheet"].map(id => document.getElementById(id));

  function closeAllSheets() {
    scrim.classList.remove("open");
    allSheets.forEach(s => s.classList.remove("open"));
  }
  function openSheetEl(el) {
    scrim.classList.add("open");
    el.classList.add("open");
  }
  scrim.addEventListener("click", closeAllSheets);

  function parseAmount(str) {
    const n = parseFloat(String(str).replace(",", "."));
    return isNaN(n) ? 0 : n;
  }

  // --- Expense sheet ---
  const sheet = document.getElementById("sheet");
  const amountInput = document.getElementById("amountInput");
  const noteInput = document.getElementById("noteInput");
  const dateInput = document.getElementById("dateInput");
  const saveBtn = document.getElementById("saveBtn");
  const amountRow = document.getElementById("amountRow");

  function defaultDateForViewedMonth() {
    const real = new Date();
    const isRealCurrentMonth = viewDate.getFullYear() === real.getFullYear() && viewDate.getMonth() === real.getMonth();
    if (isRealCurrentMonth) return real.toISOString().slice(0,10);
    const lastDay = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
    const day = Math.min(real.getDate(), lastDay);
    const d = new Date(viewDate.getFullYear(), viewDate.getMonth(), day);
    return d.toISOString().slice(0,10);
  }

  function openExpenseSheet() {
    selectedCat = null;
    amountInput.value = "";
    noteInput.value = "";
    dateInput.value = defaultDateForViewedMonth();
    catGrid.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("selected"));
    document.getElementById("noteSuggestions").innerHTML = "";
    validateExpenseForm();
    document.getElementById("favContainer").innerHTML = "";
    openSheetEl(sheet);
    setTimeout(() => amountInput.focus(), 300);
  }

  function getNoteHistory() {
    const map = {};
    entries.forEach(e => {
      const noteTrim = (e.note || "").trim();
      if (!noteTrim) return;
      const key = noteTrim.toLowerCase();
      if (!map[key]) map[key] = { note: noteTrim, cat: e.cat, amount: e.amount, count: 0, latest: 0 };
      map[key].count++;
      if ((e.createdAt || 0) >= map[key].latest) { map[key].cat = e.cat; map[key].amount = e.amount; map[key].latest = e.createdAt || 0; }
    });
    return Object.values(map);
  }

  function updateNoteSuggestions() {
    const box = document.getElementById("noteSuggestions");
    const val = noteInput.value.trim().toLowerCase();
    if (!val) { box.innerHTML = ""; return; }
    const history = getNoteHistory();
    const matches = history
      .filter(h => h.note.toLowerCase() !== val && h.note.toLowerCase().includes(val))
      .sort((a,b) => {
        const aStarts = a.note.toLowerCase().startsWith(val) ? 1 : 0;
        const bStarts = b.note.toLowerCase().startsWith(val) ? 1 : 0;
        return bStarts - aStarts || b.count - a.count || b.latest - a.latest;
      })
      .slice(0,5);
    if (matches.length === 0) { box.innerHTML = ""; return; }
    box.innerHTML = matches.map((m,i) => {
      const cat = catById[m.cat] || catById.sonstiges;
      return `<div class="note-suggestion-item" data-idx="${i}">${cat.icon} ${escapeHtml(m.note)} <span style="margin-left:auto;color:var(--ink-soft);font-weight:600;">${fmtMoney(m.amount)} €</span></div>`;
    }).join("");
    box.querySelectorAll(".note-suggestion-item").forEach(el => {
      el.addEventListener("click", () => {
        const m = matches[parseInt(el.dataset.idx, 10)];
        noteInput.value = m.note;
        selectedCat = m.cat;
        catGrid.querySelectorAll(".cat-btn").forEach(b => b.classList.toggle("selected", b.dataset.id === m.cat));
        box.innerHTML = "";
        validateExpenseForm();
        amountInput.focus();
      });
    });
  }
  noteInput.addEventListener("input", updateNoteSuggestions);

  function computeFavorites() {
    const freq = {};
    entries.forEach(e => {
      const key = (e.note || "").trim().toLowerCase() + "|" + e.cat;
      if (!freq[key]) freq[key] = { count: 0, note: e.note, cat: e.cat, amount: e.amount, latest: e.createdAt || 0 };
      freq[key].count++;
      if ((e.createdAt || 0) >= freq[key].latest) { freq[key].amount = e.amount; freq[key].latest = e.createdAt || 0; }
    });
    return Object.values(freq).filter(f => f.count >= 2 && f.note).sort((a,b) => b.count - a.count).slice(0,4);
  }

  function renderFavoritesInSheet() {
    const favContainer = document.getElementById("favContainer");
    const favorites = computeFavorites();
    if (favorites.length === 0) { favContainer.innerHTML = ""; return; }
    favContainer.innerHTML = `
      <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;">Schnelleingabe</div>
      <div class="fav-row">` + favorites.map((f,i) => {
        const cat = catById[f.cat] || catById.sonstiges;
        return `<button type="button" class="fav-chip" data-idx="${i}">${cat.icon} ${escapeHtml(f.note)} · ${fmtMoney(f.amount)} €</button>`;
      }).join("") + `</div>
      <div class="scan-divider">oder manuell</div>`;
    favContainer.querySelectorAll(".fav-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        const f = favorites[parseInt(btn.dataset.idx, 10)];
        if (!f) return;
        addEntryRecord({
          id: Date.now() + "-" + Math.random().toString(36).slice(2,8),
          amount: f.amount,
          cat: f.cat,
          note: f.note,
          date: new Date().toISOString().slice(0,10),
          createdAt: Date.now()
        });
        closeAllSheets();
      });
    });
  }

  amountInput.addEventListener("focus", () => amountRow.classList.add("focused"));
  amountInput.addEventListener("blur", () => amountRow.classList.remove("focused"));
  amountInput.addEventListener("input", () => {
    amountInput.value = amountInput.value.replace(/[^0-9,\.]/g, "");
    validateExpenseForm();
  });
  function validateExpenseForm() {
    saveBtn.disabled = !(parseAmount(amountInput.value) > 0 && selectedCat && dateInput.value);
  }
  dateInput.addEventListener("change", validateExpenseForm);

  saveBtn.addEventListener("click", () => {
    const amount = parseAmount(amountInput.value);
    if (!(amount > 0) || !selectedCat || !dateInput.value) return;
    addEntryRecord({
      id: Date.now() + "-" + Math.random().toString(36).slice(2,8),
      amount: amount,
      cat: selectedCat,
      note: noteInput.value.trim(),
      date: dateInput.value,
      createdAt: Date.now()
    });
    closeAllSheets();
  });

  // --- Limit sheet ---
  const limitSheet = document.getElementById("limitSheet");
  const limitAmountInput = document.getElementById("limitAmountInput");
  const limitAmountRow = document.getElementById("limitAmountRow");
  const limitSaveBtn = document.getElementById("limitSaveBtn");
  const limitRemoveBtn = document.getElementById("limitRemoveBtn");

  function openLimitSheet(catId) {
    limitEditingCat = catId;
    const cat = catById[catId];
    document.getElementById("limitSheetTitle").textContent = "Budget für " + cat.label;
    const existing = budgets[catId];
    limitAmountInput.value = existing ? String(existing).replace(".", ",") : "";
    limitRemoveBtn.style.display = existing ? "block" : "none";
    openSheetEl(limitSheet);
    setTimeout(() => limitAmountInput.focus(), 300);
  }
  limitAmountInput.addEventListener("focus", () => limitAmountRow.classList.add("focused"));
  limitAmountInput.addEventListener("blur", () => limitAmountRow.classList.remove("focused"));
  limitAmountInput.addEventListener("input", () => {
    limitAmountInput.value = limitAmountInput.value.replace(/[^0-9,\.]/g, "");
  });
  limitSaveBtn.addEventListener("click", () => {
    const amount = parseAmount(limitAmountInput.value);
    if (!(amount > 0) || !limitEditingCat) return;
    budgets[limitEditingCat] = amount;
    closeAllSheets();
    render();
    setBudgetRecord(limitEditingCat, amount);
  });
  limitRemoveBtn.addEventListener("click", () => {
    const cat = limitEditingCat;
    if (cat) delete budgets[cat];
    closeAllSheets();
    render();
    if (cat) deleteBudgetRecord(cat);
  });

  // --- Goal sheet (new savings goal) ---
  const goalSheet = document.getElementById("goalSheet");
  const goalNameInput = document.getElementById("goalNameInput");
  const goalAmountInput = document.getElementById("goalAmountInput");
  const goalAmountRow = document.getElementById("goalAmountRow");
  const goalDueDateInput = document.getElementById("goalDueDateInput");
  const goalSaveBtn = document.getElementById("goalSaveBtn");

  function openGoalSheet() {
    goalNameInput.value = "";
    goalAmountInput.value = "";
    goalDueDateInput.value = "";
    validateGoalForm();
    openSheetEl(goalSheet);
    setTimeout(() => goalNameInput.focus(), 300);
  }
  function validateGoalForm() {
    goalSaveBtn.disabled = !(goalNameInput.value.trim() && parseAmount(goalAmountInput.value) > 0);
  }
  goalNameInput.addEventListener("input", validateGoalForm);
  goalAmountInput.addEventListener("focus", () => goalAmountRow.classList.add("focused"));
  goalAmountInput.addEventListener("blur", () => goalAmountRow.classList.remove("focused"));
  goalAmountInput.addEventListener("input", () => {
    goalAmountInput.value = goalAmountInput.value.replace(/[^0-9,\.]/g, "");
    validateGoalForm();
  });
  goalSaveBtn.addEventListener("click", () => {
    const name = goalNameInput.value.trim();
    const target = parseAmount(goalAmountInput.value);
    if (!name || !(target > 0)) return;
    const newGoal = { id: Date.now() + "-" + Math.random().toString(36).slice(2,8), name, target, saved: 0, dueDate: goalDueDateInput.value || null };
    goals.push(newGoal);
    closeAllSheets();
    render();
    addGoalRecord(newGoal);
  });

  // --- Contribution sheet (add money to a goal) ---
  const contribSheet = document.getElementById("contribSheet");
  const contribAmountInput = document.getElementById("contribAmountInput");
  const contribAmountRow = document.getElementById("contribAmountRow");
  const contribSaveBtn = document.getElementById("contribSaveBtn");

  function openContribSheet(goalId) {
    contribEditingGoalId = goalId;
    const g = goals.find(x => x.id === goalId);
    document.getElementById("contribSheetTitle").textContent = "Geld zu \"" + (g ? g.name : "") + "\" hinzufügen";
    contribAmountInput.value = "";
    contribSaveBtn.disabled = true;
    openSheetEl(contribSheet);
    setTimeout(() => contribAmountInput.focus(), 300);
  }
  contribAmountInput.addEventListener("focus", () => contribAmountRow.classList.add("focused"));
  contribAmountInput.addEventListener("blur", () => contribAmountRow.classList.remove("focused"));
  contribAmountInput.addEventListener("input", () => {
    contribAmountInput.value = contribAmountInput.value.replace(/[^0-9,\.]/g, "");
    contribSaveBtn.disabled = !(parseAmount(contribAmountInput.value) > 0);
  });
  contribSaveBtn.addEventListener("click", () => {
    const amount = parseAmount(contribAmountInput.value);
    const g = goals.find(x => x.id === contribEditingGoalId);
    if (!(amount > 0) || !g) return;
    const newSaved = g.saved + amount;
    g.saved = newSaved;
    closeAllSheets();
    render();
    updateGoalSaved(g.id, newSaved);
  });

  // --- Transfer sheet (move money between goals) ---
  const transferSheet = document.getElementById("transferSheet");
  const transferTargetSelect = document.getElementById("transferTargetSelect");
  const transferAmountInput = document.getElementById("transferAmountInput");
  const transferAmountRow = document.getElementById("transferAmountRow");
  const transferSaveBtn = document.getElementById("transferSaveBtn");
  let transferSourceGoalId = null;

  function openTransferSheet(goalId) {
    transferSourceGoalId = goalId;
    const source = goals.find(x => x.id === goalId);
    if (!source) return;
    const others = goals.filter(x => x.id !== goalId);
    if (others.length === 0) {
      alert("Du brauchst mindestens ein zweites Sparziel, um Geld dorthin zu verschieben.");
      return;
    }
    document.getElementById("transferSheetTitle").textContent = "Von \"" + source.name + "\" verschieben";
    transferTargetSelect.innerHTML = others.map(g => `<option value="${g.id}">${escapeHtml(g.name)}</option>`).join("");
    transferAmountInput.value = "";
    transferSaveBtn.disabled = true;
    openSheetEl(transferSheet);
    setTimeout(() => transferAmountInput.focus(), 300);
  }
  transferAmountInput.addEventListener("focus", () => transferAmountRow.classList.add("focused"));
  transferAmountInput.addEventListener("blur", () => transferAmountRow.classList.remove("focused"));
  transferAmountInput.addEventListener("input", () => {
    transferAmountInput.value = transferAmountInput.value.replace(/[^0-9,\.]/g, "");
    transferSaveBtn.disabled = !(parseAmount(transferAmountInput.value) > 0);
  });
  transferSaveBtn.addEventListener("click", () => {
    const amount = parseAmount(transferAmountInput.value);
    const source = goals.find(x => x.id === transferSourceGoalId);
    const target = goals.find(x => x.id === transferTargetSelect.value);
    if (!(amount > 0) || !source || !target) return;
    const newSourceSaved = Math.max(source.saved - amount, 0);
    const newTargetSaved = target.saved + amount;
    source.saved = newSourceSaved;
    target.saved = newTargetSaved;
    closeAllSheets();
    render();
    updateGoalSaved(source.id, newSourceSaved);
    updateGoalSaved(target.id, newTargetSaved);
  });

  // --- Abo sheet (new subscription) ---
  const aboSheet = document.getElementById("aboSheet");
  const aboNameInput = document.getElementById("aboNameInput");
  const aboAmountInput = document.getElementById("aboAmountInput");
  const aboAmountRow = document.getElementById("aboAmountRow");
  const aboDateInput = document.getElementById("aboDateInput");
  const aboDateLabel = document.getElementById("aboDateLabel");
  const aboMonthlyBtn = document.getElementById("aboMonthlyBtn");
  const aboYearlyBtn = document.getElementById("aboYearlyBtn");
  const aboOnceBtn = document.getElementById("aboOnceBtn");
  const aboSaveBtn = document.getElementById("aboSaveBtn");

  function setAboInterval(interval) {
    aboInterval = interval;
    aboMonthlyBtn.classList.toggle("selected", interval === "monthly");
    aboYearlyBtn.classList.toggle("selected", interval === "yearly");
    aboOnceBtn.classList.toggle("selected", interval === "once");
    aboDateLabel.textContent = interval === "monthly" ? "Nächste Abbuchung"
      : interval === "yearly" ? "Abbuchungsdatum (Monat & Tag zählen)"
      : "Fälligkeitsdatum";
  }

  function openAboSheet() {
    aboNameInput.value = "";
    aboAmountInput.value = "";
    aboDateInput.value = new Date().toISOString().slice(0,10);
    setAboInterval("monthly");
    validateAboForm();
    openSheetEl(aboSheet);
    setTimeout(() => aboNameInput.focus(), 300);
  }
  function validateAboForm() {
    aboSaveBtn.disabled = !(aboNameInput.value.trim() && parseAmount(aboAmountInput.value) > 0 && aboDateInput.value);
  }
  aboNameInput.addEventListener("input", validateAboForm);
  aboAmountInput.addEventListener("focus", () => aboAmountRow.classList.add("focused"));
  aboAmountInput.addEventListener("blur", () => aboAmountRow.classList.remove("focused"));
  aboAmountInput.addEventListener("input", () => {
    aboAmountInput.value = aboAmountInput.value.replace(/[^0-9,\.]/g, "");
    validateAboForm();
  });
  aboDateInput.addEventListener("change", validateAboForm);
  aboMonthlyBtn.addEventListener("click", () => setAboInterval("monthly"));
  aboYearlyBtn.addEventListener("click", () => setAboInterval("yearly"));
  aboOnceBtn.addEventListener("click", () => setAboInterval("once"));
  aboSaveBtn.addEventListener("click", () => {
    const name = aboNameInput.value.trim();
    const amount = parseAmount(aboAmountInput.value);
    if (!name || !(amount > 0) || !aboDateInput.value) return;
    addAboRecord({
      id: Date.now() + "-" + Math.random().toString(36).slice(2,8),
      name, amount, interval: aboInterval, date: aboDateInput.value
    });
    closeAllSheets();
  });

  // --- Salary sheet ---
  const salarySheet = document.getElementById("salarySheet");
  const salaryAmountInput = document.getElementById("salaryAmountInput");
  const salaryAmountRow = document.getElementById("salaryAmountRow");
  const salarySaveBtn = document.getElementById("salarySaveBtn");

  document.getElementById("editSalaryBtn").addEventListener("click", () => {
    salaryAmountInput.value = salary > 0 ? String(salary).replace(".", ",") : "";
    openSheetEl(salarySheet);
    setTimeout(() => salaryAmountInput.focus(), 300);
  });
  salaryAmountInput.addEventListener("focus", () => salaryAmountRow.classList.add("focused"));
  salaryAmountInput.addEventListener("blur", () => salaryAmountRow.classList.remove("focused"));
  salaryAmountInput.addEventListener("input", () => {
    salaryAmountInput.value = salaryAmountInput.value.replace(/[^0-9,\.]/g, "");
  });
  salarySaveBtn.addEventListener("click", () => {
    const amount = parseAmount(salaryAmountInput.value);
    salary = amount;
    closeAllSheets();
    render();
    setSalaryRecord(amount);
  });

  // FAB — context sensitive
  document.getElementById("addBtn").addEventListener("click", () => {
    if (activeTab === "list") openExpenseSheet();
    else if (activeTab === "sparen") openGoalSheet();
    else if (activeTab === "abos") openAboSheet();
  });
const BANK_SYNC_URL =
  "https://ausgabentracker-bank-sandbox.davidberghofer05.workers.dev/import";

const BANK_SYNC_KEY_STORAGE =
  "kassenbuch_bank_sync_key_v1";
function askBankSyncKey() {
  return new Promise(resolve => {
    const overlay = document.createElement("div");

    overlay.style.cssText =
      "position:fixed;inset:0;z-index:99999;" +
      "background:rgba(0,0,0,.72);" +
      "display:flex;align-items:center;" +
      "justify-content:center;padding:22px;";

    const box = document.createElement("div");

    box.style.cssText =
      "width:100%;max-width:420px;" +
      "background:var(--surface);" +
      "color:var(--ink);" +
      "border:1px solid var(--line);" +
      "border-radius:18px;padding:22px;" +
      "box-shadow:0 20px 60px rgba(0,0,0,.35);";

    const title = document.createElement("div");
    title.textContent = "Bank-Sync einrichten";
    title.style.cssText =
      "font-size:20px;font-weight:700;" +
      "margin-bottom:8px;";

    const text = document.createElement("div");
    text.textContent =
      "Bitte deinen Kassenbuch-Sync-Schlüssel eingeben.";
    text.style.cssText =
      "font-size:14px;color:var(--ink-soft);" +
      "margin-bottom:16px;";

    const input = document.createElement("input");
    input.type = "password";
    input.autocomplete = "off";
    input.placeholder = "Sync-Schlüssel";
    input.style.cssText =
      "width:100%;padding:12px;" +
      "font-size:16px;border:1.5px solid var(--line);" +
      "border-radius:12px;background:var(--surface);" +
      "color:var(--ink);margin-bottom:12px;";

    const save = document.createElement("button");
    save.textContent = "Verbinden";
    save.style.cssText =
      "width:100%;padding:14px;border:0;" +
      "border-radius:12px;background:var(--accent);" +
      "color:var(--accent-ink);" +
      "font-size:16px;font-weight:700;";

    const cancel = document.createElement("button");
    cancel.textContent = "Später";
    cancel.style.cssText =
      "width:100%;padding:12px;border:0;" +
      "background:transparent;color:var(--ink-soft);" +
      "font-size:14px;margin-top:6px;";

    function finish(value) {
      overlay.remove();
      resolve(value);
    }

    save.addEventListener("click", () => {
      const value = input.value.trim();

      if (!value) {
        input.focus();
        return;
      }

      finish(value);
    });

    cancel.addEventListener("click", () => {
      finish(null);
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        save.click();
      }
    });

    box.append(
      title,
      text,
      input,
      save,
      cancel
    );

    overlay.appendChild(box);
    document.body.appendChild(overlay);

    setTimeout(() => input.focus(), 50);
  });
}

async function syncBankImports() {
  let syncKey =
  localStorage.getItem(
    BANK_SYNC_KEY_STORAGE
  );

if (!syncKey) {
const enteredKey = await askBankSyncKey();
  if (!enteredKey) {
    return;
  }

  syncKey = enteredKey.trim();

  if (!syncKey) {
    return;
  }

  localStorage.setItem(
    BANK_SYNC_KEY_STORAGE,
    syncKey
  );
}

  try {
    const response =
      await fetch(BANK_SYNC_URL, {
        method: "GET",
        headers: {
          "X-Kassenbuch-Key": syncKey
        },
        cache: "no-store"
      });

    if (!response.ok) {
  if (response.status === 401) {
    localStorage.removeItem(
      BANK_SYNC_KEY_STORAGE
    );

    alert(
      "Der Bank-Sync-Schlüssel ist falsch. Bitte beim nächsten Start erneut eingeben."
    );
  }

  console.log(
    "Bank-Sync fehlgeschlagen:",
    response.status
  );
  return;
}

    const data =
      await response.json();

    for (const item of data.imports || []) {
      const entry = {
        id:
          "bank_" + item.transactionId,
        amount:
  Math.abs(Number(item.amount)),
        direction:
  item.direction === "credit"
    ? "credit"
    : "debit",
        cat:
          item.category,
        note:
          item.note || "Banktransaktion",
        date:
          item.date ||
          new Date()
            .toISOString()
            .slice(0, 10),
        createdAt:
          Date.now()
      };

      if (useDbEntries && dbNS) {
        await dbNS
          .collection("entries")
          .doc(entry.id)
          .set(entry);
      } else {
        const alreadyExists =
          entries.some(
            e => e.id === entry.id
          );

        if (!alreadyExists) {
          entries.push(entry);
          saveEntriesLocal();
        }
      }

      const confirmResponse =
        await fetch(BANK_SYNC_URL, {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json",
            "X-Kassenbuch-Key":
              syncKey
          },
          body: JSON.stringify({
            token: item.token
          })
        });

      if (!confirmResponse.ok) {
        throw new Error(
          "Import-Bestätigung fehlgeschlagen"
        );
      }
    }

    if (
      (data.imports || []).length > 0
    ) {
      render();
    }
  } catch (error) {
    console.log(
      "Bank-Sync Fehler:",
      error
    );
  }
}
  initStores()
  .then(() => syncBankImports())
  .catch(error => {
    console.log(
      "Startfehler:",
      error
    );
  });
})();
