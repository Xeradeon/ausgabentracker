<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AusgabenTracker</title>
<style>
:root {
  --bg0:#030303;
  --bg1:#0b0502;
  --orange:#ff7200;
  --orange2:#ff9f2e;
  --orange3:#ffd08a;
  --text:#ffffff;
  --muted:rgba(255,255,255,.56);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
body{min-height:100svh;display:grid;place-items:center;position:relative;isolation:isolate}

body.day {
  --bg0:#090604; --bg1:#170a02; --orange:#ff7b00; --orange2:#ffb04b; --orange3:#ffe0b0;
}
body.night {
  --bg0:#020202; --bg1:#090201; --orange:#ff5f00; --orange2:#ff8a18; --orange3:#ffc56b;
}

.bg {
  position:fixed; inset:0; z-index:-4;
  background:
    radial-gradient(circle at 50% 38%, rgba(255,110,0,.22), transparent 26%),
    radial-gradient(circle at 50% 64%, rgba(255,80,0,.08), transparent 40%),
    linear-gradient(180deg,var(--bg1),var(--bg0));
}

.vignette {
  position:fixed;inset:0;z-index:7;pointer-events:none;
  box-shadow:inset 0 0 160px rgba(0,0,0,.88);
}

.flame-orbit {
  position:fixed; left:50%; top:47%; width:min(88vw,520px); aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    conic-gradient(from 10deg,
      transparent 0 8%,
      rgba(255,85,0,.08) 9%,
      rgba(255,130,0,.62) 16%,
      rgba(255,190,90,.88) 20%,
      rgba(255,90,0,.18) 25%,
      transparent 32% 55%,
      rgba(255,95,0,.45) 62%,
      rgba(255,155,35,.82) 70%,
      transparent 77% 100%);
  filter:blur(9px) drop-shadow(0 0 18px rgba(255,95,0,.28));
  animation:orbit 5.6s linear infinite;
  opacity:.88; z-index:-2;
}

.flame-orbit::after {
  content:""; position:absolute; inset:10%;
  border-radius:50%; border:1px solid rgba(255,135,30,.28);
  box-shadow:0 0 26px rgba(255,100,0,.18), inset 0 0 28px rgba(255,100,0,.09);
}

.particles{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.particle {
  position:absolute; bottom:-20px; width:4px; height:4px; border-radius:50%;
  background:var(--orange2);
  box-shadow:0 0 10px var(--orange),0 0 20px rgba(255,100,0,.55);
  opacity:0; animation:rise var(--dur) linear infinite;
  animation-delay:var(--delay);
  left:var(--x);
  transform:scale(var(--s));
}
.particle.streak{width:2px;height:12px;border-radius:3px;filter:blur(.2px)}

.card {
  width:100%; padding:24px; display:flex; flex-direction:column; align-items:center;
  transform:translateY(-2vh); animation:enter .72s cubic-bezier(.2,.85,.2,1) both;
}

.stage{position:relative;width:184px;height:184px;display:grid;place-items:center;margin-bottom:20px}

.ringA,.ringB,.ringC {
  position:absolute;border-radius:50%;inset:0;
}
.ringA {
  background:conic-gradient(from 0deg,transparent 0 10%,var(--orange) 15%,var(--orange3) 23%,transparent 32% 60%,var(--orange2) 72%,transparent 84%);
  filter:blur(1.2px) drop-shadow(0 0 14px rgba(255,100,0,.6));
  animation:spin 2.25s linear infinite;
}
.ringB {
  inset:13px;border:1px solid rgba(255,160,70,.36);
  box-shadow:0 0 30px rgba(255,100,0,.2),inset 0 0 18px rgba(255,110,0,.12);
  animation:spinR 3.8s linear infinite;
}
.ringC {
  inset:-18px;
  background:radial-gradient(circle,rgba(255,110,0,.18),transparent 58%);
  filter:blur(16px);animation:pulse 1.8s ease-in-out infinite alternate;
}

.iconShell {
  width:138px;height:138px;border-radius:31px;overflow:hidden;position:relative;z-index:4;
  box-shadow:0 0 0 1px rgba(255,255,255,.05),0 0 34px rgba(255,110,0,.34),0 20px 60px rgba(0,0,0,.45);
}
.iconShell img{width:100%;height:100%;object-fit:cover;display:block}
.iconShell::after {
  content:"";position:absolute;inset:-35%;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.22) 45%,transparent 61%);
  transform:translateX(-80%) rotate(10deg);animation:shine 2.3s ease-in-out infinite;
}

.title {
  margin:0;font-size:29px;font-weight:780;letter-spacing:-.7px;color:var(--text);
  text-shadow:0 2px 18px rgba(0,0,0,.5);
  animation:titleGlow 2s ease-in-out infinite alternate;
}
.subtitle{margin:8px 0 24px;color:var(--muted);font-size:14px;letter-spacing:.18px}

.track {
  width:158px;height:9px;padding:2px;border-radius:999px;background:rgba(255,255,255,.08);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
}
.bar{height:100%;border-radius:999px;overflow:hidden;background:rgba(0,0,0,.3)}
.fill {
  width:100%;height:100%;transform-origin:left center;transform:scaleX(0);
  background:repeating-linear-gradient(90deg,var(--orange) 0 15px,var(--orange2) 15px 30px);
  box-shadow:0 0 16px rgba(255,110,0,.85),0 0 32px rgba(255,110,0,.28);
  animation:load 2.15s cubic-bezier(.12,.72,.1,1) forwards;
  position:relative;
}
.fill::after {
  content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:translateX(-100%);animation:sweep 1s ease-in-out .35s infinite;
}

.modeBadge {
  margin-top:14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,170,85,.55);
}

.flash {
  position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%,rgba(255,183,94,.72),rgba(255,100,0,.18) 24%,rgba(0,0,0,0) 58%);
}
.flash.go{animation:impact .38s ease-out forwards}

.fadeOut{animation:leave .32s ease forwards}

body.variant2 .stage{transform:scale(.95)}
body.variant2 .flame-orbit{animation-duration:4.2s;opacity:.72}
body.variant2 .title{letter-spacing:-.3px}
body.variant3 .ringA{animation-duration:1.5s}
body.variant3 .flame-orbit{filter:blur(12px) drop-shadow(0 0 28px rgba(255,80,0,.42));opacity:1}

@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.965)}to{opacity:1;transform:translateY(-2vh) scale(1)}}
@keyframes leave{to{opacity:0;transform:translateY(-2vh) scale(1.035);filter:blur(1px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes pulse{from{opacity:.45;transform:scale(.95)}to{opacity:1;transform:scale(1.05)}}
@keyframes shine{0%,30%{transform:translateX(-95%) rotate(10deg)}65%,100%{transform:translateX(95%) rotate(10deg)}}
@keyframes load{to{transform:scaleX(1)}}
@keyframes sweep{to{transform:translateX(135%)}}
@keyframes titleGlow{from{text-shadow:0 2px 18px rgba(0,0,0,.5)}to{text-shadow:0 2px 18px rgba(0,0,0,.5),0 0 15px rgba(255,115,0,.18)}}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) scale(var(--s));opacity:0}
  10%{opacity:.95}
  70%{opacity:.75}
  100%{transform:translateY(-105vh) translateX(var(--drift)) scale(calc(var(--s)*.45));opacity:0}
}
@keyframes impact{0%{opacity:0}30%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){
  .ringA,.ringB,.ringC,.flame-orbit,.fill,.fill::after,.iconShell::after,.particle,.title{animation:none!important}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="flame-orbit"></div>
<div class="particles" id="particles"></div>
<div class="vignette"></div>

<main class="card" id="card">
  <div class="stage">
    <div class="ringA"></div><div class="ringB"></div><div class="ringC"></div>
    <div class="iconShell"><img src="./icon.png?v=ultimate1" alt=""></div>
  </div>
  <h1 class="title">AusgabenTracker</h1>
  <div class="subtitle">Wird gestartet …</div>
  <div class="track"><div class="bar"><div class="fill"></div></div></div>
  <div class="modeBadge" id="modeBadge"></div>
</main>

<script>
(function(){
  // Day/night variant
  const h = new Date().getHours();
  const day = h >= 7 && h < 19;
  document.body.classList.add(day ? "day" : "night");
  document.getElementById("modeBadge").textContent = day ? "DAY MODE" : "NIGHT MODE";

  // Rotate through 3 slightly different splash styles on each launch
  let n = 0;
  try {
    n = (parseInt(localStorage.getItem("splashVariant") || "0", 10) + 1) % 3;
    localStorage.setItem("splashVariant", String(n));
  } catch(e) {}
  document.body.classList.add("variant" + (n + 1));

  // Ember particles
  const p = document.getElementById("particles");
  for(let i=0;i<34;i++) {
    const e = document.createElement("i");
    e.className = "particle" + (i % 7 === 0 ? " streak" : "");
    e.style.setProperty("--x", (4 + Math.random()*92) + "%");
    e.style.setProperty("--delay", (-Math.random()*5).toFixed(2) + "s");
    e.style.setProperty("--dur", (3.6 + Math.random()*4.4).toFixed(2) + "s");
    e.style.setProperty("--s", (0.55 + Math.random()*1.35).toFixed(2));
    e.style.setProperty("--drift", ((Math.random()-.5)*70).toFixed(0) + "px");
    p.appendChild(e);
  }

  // Try subtle startup sound. iOS may block autoplay; failure is intentionally silent.
  const snd = document.getElementById("startSound");
  try {
    snd.volume = 0.16;
    const pr = snd.play();
    if(pr && pr.catch) pr.catch(()=>{});
  } catch(e) {}

  // Cinematic exit
  const target = 'https://claude.ai/artifact/FUVDim8wYYuAdwDgCAKNWW?v=3';
  setTimeout(function(){
    document.getElementById("flash").classList.add("go");
    document.getElementById("card").classList.add("fadeOut");
    setTimeout(function(){
      window.location.replace(target);
    }, 260);
  }, 2250);
})();
</script>
