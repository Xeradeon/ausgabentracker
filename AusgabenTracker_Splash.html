<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AusgabenTracker</title>
  <style>
    :root {
      color-scheme: dark;
      --orange: #ff7a00;
      --orange2: #ff9a24;
      --bg: #000;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    }
    .wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-2vh);
      animation: enter .55s cubic-bezier(.2,.8,.2,1) both;
    }
    .icon-wrap {
      width: 132px;
      height: 132px;
      border-radius: 31px;
      position: relative;
      isolation: isolate;
      filter: drop-shadow(0 0 22px rgba(255,122,0,.24));
    }
    .icon-wrap::before {
      content: "";
      position: absolute;
      inset: -22px;
      border-radius: 44px;
      background: radial-gradient(circle, rgba(255,122,0,.22), transparent 68%);
      z-index: -1;
      animation: breathe 1.4s ease-in-out infinite alternate;
    }
    .icon {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 31px;
    }
    h1 {
      margin: 25px 0 6px;
      color: #fff;
      font-size: 25px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -.5px;
    }
    .sub {
      color: rgba(255,255,255,.5);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .bar {
      width: 112px;
      height: 3px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.11);
    }
    .fill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      background: linear-gradient(90deg,var(--orange),var(--orange2));
      animation: load 1.25s ease-out both;
      box-shadow: 0 0 10px rgba(255,122,0,.7);
    }
    .fade {
      animation: leave .28s ease forwards;
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(10px) scale(.96); }
      to   { opacity: 1; transform: translateY(-2vh) scale(1); }
    }
    @keyframes breathe {
      from { opacity: .45; transform: scale(.96); }
      to   { opacity: 1; transform: scale(1.05); }
    }
    @keyframes load {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
    @keyframes leave {
      to { opacity: 0; transform: scale(1.015); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wrap, .icon-wrap::before, .fill { animation: none; }
    }
  </style>
</head>
